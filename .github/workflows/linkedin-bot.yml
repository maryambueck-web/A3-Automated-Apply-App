name: linkedin-bot

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/linkedin-app:${{ github.sha }} .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/linkedin-app:${{ github.sha }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Update deployment image
        run: |
          sed -i.bak "s|your-registry/linkedin-app:latest|${{ secrets.ACR_LOGIN_SERVER }}/linkedin-app:${{ github.sha }}|g" k8s/linkedin-app/deployment.yaml
          sed -i.bak "s|your-registry/linkedin-app:latest|${{ secrets.ACR_LOGIN_SERVER }}/linkedin-app:${{ github.sha }}|g" k8s/linkedin-app/cronjob.yaml

      - name: Deploy manifests
        run: kubectl apply -f k8s/linkedin-app/
