services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_API_KEY: ${APP_API_KEY:-change-me}
      DATABASE_URL: sqlite:////app/data/linkedin_apply.db
      CORS_ORIGINS: http://localhost:5173
      LINKEDIN_EMAIL: ${LINKEDIN_EMAIL:-}
      LINKEDIN_PASSWORD: ${LINKEDIN_PASSWORD:-}
      LINKEDIN_HEADLESS: ${LINKEDIN_HEADLESS:-true}
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_API_KEY: ${APP_API_KEY:-change-me}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  backend_data:
  frontend_node_modules: